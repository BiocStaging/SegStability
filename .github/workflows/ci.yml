name: Bioconductor CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bioccheck:
    uses: Bioconductor/workflows/.github/workflows/bioccheck.yml@5794bc5c380252d542b47d6b91971fb72c45f777
    with:
      bioc_version: devel
      error_on: warning
      enable_pkgdown: false
